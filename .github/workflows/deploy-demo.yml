name: Publish demo to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Historical.Reconstruction.WebClient/package-lock.json
      - run: npm ci
        working-directory: Historical.Reconstruction.WebClient
      - run: npm run build:demo
        working-directory: Historical.Reconstruction.WebClient
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Historical.Reconstruction.WebClient/dist
      - uses: actions/deploy-pages@v4
        id: deployment
